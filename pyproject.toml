[project]
name = "gpu-lab"
version = "0.1.0"
description = "Zero-abstraction ML systems lab: from Python, matrices & GPUs to toy Transformers, Gemma 4 fine-tuning, serving & real-time voice AI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
# CPU exercises live next to their tests in sections/<NN>/exercises/.
# pytest puts each test file's folder on sys.path, so every module name must be unique repo-wide.
testpaths = ["sections"]
python_files = ["test_*.py"]
addopts = "-q --no-header"
